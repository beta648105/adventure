<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Adventure</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    height: 100%;
    background: #1a1a1a;            /* 캔버스 바깥 여백 */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #screen {
    background: #ffffff;            /* 게임 배경: 흰색 */
    image-rendering: pixelated;     /* 픽셀 뭉개짐 방지 */
    image-rendering: crisp-edges;
    display: block;
  }
</style>
</head>
<body>
  <canvas id="screen"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
